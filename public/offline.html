<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>Sin conexión — TukiTask</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f0f1a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
      text-align: center;
      gap: 0;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin-bottom: 28px;
      filter: drop-shadow(0 4px 24px rgba(245,197,24,0.35));
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      background: rgba(245,197,24,0.12);
      border: 2px solid rgba(245,197,24,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      font-size: 2rem;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(245,197,24,0.3); }
      50%      { box-shadow: 0 0 0 16px rgba(245,197,24,0); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f1f5f9;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 300px;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F5C518;
      color: #0f0f1a;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 13px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
      margin-bottom: 16px;
    }
    .btn:active { opacity: 0.8; }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 32px;
    }

    .dots {
      display: flex;
      gap: 6px;
      margin-top: -8px;
      margin-bottom: 32px;
    }
    .dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #334155;
      animation: blink 1.4s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%,80%,100% { opacity: .2; }
      40%          { opacity: 1; background: #F5C518; }
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="TukiTask" class="logo"
       onerror="this.style.display='none'; document.querySelector('.icon-wrap').style.display='flex'" />
  <div class="icon-wrap" style="display:none">📡</div>

  <h1>Sin conexión</h1>

  <div class="dots">
    <span></span><span></span><span></span>
  </div>

  <p>No hay conexión a internet. Revisá tu red e intentá de nuevo.</p>

  <a class="btn" onclick="tryReload()">
    ↺ &nbsp;Reintentar
  </a>

  <div class="badge">TukiTask — offline</div>

  <script>
    function tryReload() {
      if (navigator.onLine) {
        // Navigate to the last known URL or home
        var last = sessionStorage.getItem('tuki_last_url') || '/';
        window.location.href = last;
      } else {
        window.location.reload();
      }
    }

    // Auto-reload when connection is restored
    window.addEventListener('online', function() {
      var last = sessionStorage.getItem('tuki_last_url') || '/';
      window.location.href = last;
    });
  </script>
</body>
</html>
