  <!-- White border rect -->
  <rect x="40" y="40" width="64" height="64" rx="14" fill="white"/>
  <!-- Yellow inner rect -->
  <rect x="50" y="50" width="44" height="44" rx="9" fill="#F5C518"/>
  <!-- Chat bubble pointer -->
  <path d="M56 125 L72 148 L88 125" fill="#2563EB"/>

  <!-- Right: Yellow rounded square with blue inner square (speech bubble) -->
  <rect x="128" y="18" width="82" height="82" rx="18" fill="#F5C518"/>
